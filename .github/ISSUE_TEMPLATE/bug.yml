name: Bug
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw and what you expected. Leave the cause out unless you already proved it.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The snippet call or the steps.
      render: markdown
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "MODX 3.2.4, PHP 8.3, pdoTools 3.0.4"
    validations:
      required: true
