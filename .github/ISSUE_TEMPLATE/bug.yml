name: Баг
description: Что-то сломалось
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Факт и что ожидали. Без догадок про причину.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Как повторить
      description: Вызов сниппета или шаги.
      render: markdown
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Версии
      placeholder: "MODX 3.1.2, PHP 8.3, pdoTools 3.0.4"
    validations:
      required: true
